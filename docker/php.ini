; Uploads have to fit a book. The admin form caps at 10 MB; leave headroom.
upload_max_filesize = 24M
post_max_size = 26M
memory_limit = 256M
max_execution_time = 60

expose_php = Off

; The official php images ship no php.ini at all, so PHP's compiled default of
; On applies — and then the `<?xml` opening sitemap.blade.php is read as a PHP
; open tag and the sitemap 500s. php.ini-production sets this Off; so do we.
short_open_tag = Off

; The container is small and the code never changes between restarts.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
