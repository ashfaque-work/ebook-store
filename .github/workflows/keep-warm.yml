name: Keep warm

# The free hosting plan stops the container after fifteen minutes with no
# traffic, and the next visitor waits about fifty seconds for it to start
# again. Pinging every ten minutes used to prevent that.
#
# The schedule is gone, deliberately, and it must not come back without doing
# this arithmetic first:
#
#   Render grants 750 free instance-hours per MONTH, per WORKSPACE — not per
#   service. Hours are only consumed while a service is awake. A service that
#   is pinged every ten minutes never sleeps, so it alone burns about 720 hours
#   a month: effectively the entire workspace allowance. When the allowance
#   runs out Render suspends EVERY free service in the workspace, so keeping
#   this one warm takes the others down with it at the end of the month.
#
# Cold starts are the cheaper problem. Warm the site by hand before showing it
# to anyone — the Actions tab, "Run workflow" — which is what workflow_dispatch
# is kept for.
on:
  workflow_dispatch:

# No repository contents are read, and nothing is written.
permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    name: Ping the health check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake the site
        env:
          # Set this as a repository variable (Settings → Secrets and variables
          # → Actions → Variables). Without it the job says so and stops,
          # rather than failing every ten minutes for weeks.
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "No SITE_URL variable set — nothing to ping."
            echo "Add it under Settings → Secrets and variables → Actions → Variables."
            exit 0
          fi

          # A cold start is the case this exists for, so the timeout has to be
          # longer than one: --max-time 90 rather than curl's default.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 --retry 2 --retry-delay 10 "$SITE_URL/up")

          echo "GET $SITE_URL/up -> $code"

          # 5xx means the app is up enough to answer, which is all this job is
          # for. Only a complete failure to connect is worth a red run.
          if [ "$code" = "000" ]; then
            echo "No response at all."
            exit 1
          fi
