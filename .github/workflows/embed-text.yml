name: Embed book text

# Semantic search needs a vector for every passage. The catalogue is about
# 10.5 million tokens, which at Workers AI's rate is roughly 64,000 neurons —
# and the free allowance is 10,000 a day. So this does a day's worth at a time
# and picks up where it left off, finishing in about a week at no cost.
#
# The store is unaffected while it runs: search stays literal until nearly
# everything is embedded, because a half-embedded index ranks worse than none.
#
# Delete this workflow once it has finished. It stops doing anything by itself
# when there is nothing left to embed, but there is no reason to keep it.
on:
  schedule:
    # Early morning UTC, when nothing else is competing for the allowance.
    - cron: '20 2 * * *'
  workflow_dispatch:
    inputs:
      passages:
        description: 'How many passages to embed in this run'
        required: false
        default: '5000'

# Reading the repository, and nothing else. A private repository cannot be
# checked out without this, and the failure it gives is "repository not found",
# which reads like a typo rather than a permission.
permissions:
  contents: read

concurrency:
  group: embed-text
  cancel-in-progress: false

jobs:
  embed:
    name: Embed a day's worth
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_pgsql, bcmath, intl, zip
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress --no-dev

      - name: Embed
        env:
          APP_ENV: production
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_CONNECTION: pgsql
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: '5432'
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          CACHE_STORE: array
          SESSION_DRIVER: array
          EMBEDDINGS_DRIVER: cloudflare
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_AI_TOKEN" ] || [ -z "$DB_HOST" ]; then
            echo "Secrets are not set yet — nothing to do."
            echo "Needed: APP_KEY, DB_HOST, DB_DATABASE, DB_USERNAME, DB_PASSWORD,"
            echo "        CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_AI_TOKEN"
            exit 0
          fi

          # A day's free allowance is about 5,300 passages. Staying under it
          # keeps this at no cost; going over would start billing.
          php artisan store:embed-text --limit="${{ inputs.passages || 5000 }}"

      - name: How far along is it
        if: always()
        env:
          DB_CONNECTION: pgsql
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: '5432'
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          APP_KEY: ${{ secrets.APP_KEY }}
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: |
          if [ -z "$DB_HOST" ]; then exit 0; fi

          php artisan tinker --execute='
            $total = DB::scalar("select count(*) from book_chunks");
            $done  = DB::scalar("select count(embedding) from book_chunks");
            printf("%d of %d passages embedded (%.1f%%)%s", $done, $total, $total ? $done / $total * 100 : 0, PHP_EOL);
            echo $done >= $total * 0.9
                ? "Semantic search is now live."
                : "Still literal-only until 90%.";
            echo PHP_EOL;
          '
