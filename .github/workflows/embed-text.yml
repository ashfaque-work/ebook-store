name: Embed book text

# Semantic search needs a vector for every passage. The catalogue is about
# 10.5 million tokens, which at Workers AI's rate is roughly 64,000 neurons —
# and the free allowance is 10,000 a day. So this does a day's worth at a time
# and picks up where it left off, which took about a week at no cost.
#
# That finished: all 33,967 passages carry a vector and search blends the
# literal and semantic rankings. The nightly schedule is gone, deliberately —
# it was waking up every morning, finding nothing to do and exiting in 25
# seconds, for a fortnight.
#
# It is kept, rather than deleted, because adding books brings the work back:
# import, sample, index, then run this from the Actions tab. It needs the
# Workers AI token to still exist, so revoke that only when no more books are
# coming.
on:
  workflow_dispatch:
    inputs:
      passages:
        description: 'How many passages to embed in this run'
        required: false
        default: '5000'

# Reading the repository, and nothing else. A private repository cannot be
# checked out without this, and the failure it gives is "repository not found",
# which reads like a typo rather than a permission.
permissions:
  contents: read

concurrency:
  group: embed-text
  cancel-in-progress: false

jobs:
  embed:
    name: Embed a day's worth
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_pgsql, bcmath, intl, zip
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress --no-dev

      - name: Embed
        env:
          APP_ENV: production
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_CONNECTION: pgsql
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: '5432'
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          CACHE_STORE: array
          SESSION_DRIVER: array
          EMBEDDINGS_DRIVER: cloudflare
          # Measured: at 32 per request a night's work would outrun the job's
          # own timeout. Workers AI takes up to a hundred texts at a time, and
          # the cost is per token either way — fewer round trips is simply
          # faster for the same neurons.
          EMBEDDINGS_BATCH: '100'
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_AI_TOKEN" ] || [ -z "$DB_HOST" ]; then
            echo "Secrets are not set yet — nothing to do."
            echo "Needed: APP_KEY, DB_HOST, DB_DATABASE, DB_USERNAME, DB_PASSWORD,"
            echo "        CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_AI_TOKEN"
            exit 0
          fi

          # A day's free allowance is about 5,300 passages. Staying under it
          # keeps this at no cost; going over would start billing.
          php artisan store:embed-text --limit="${{ inputs.passages || 5000 }}"

      - name: How far along is it
        if: always()
        env:
          DB_CONNECTION: pgsql
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: '5432'
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          APP_KEY: ${{ secrets.APP_KEY }}
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: |
          if [ -z "$DB_HOST" ]; then exit 0; fi

          php artisan tinker --execute='
            $total = DB::scalar("select count(*) from book_chunks");
            $done  = DB::scalar("select count(embedding) from book_chunks");
            printf("%d of %d passages embedded (%.1f%%)%s", $done, $total, $total ? $done / $total * 100 : 0, PHP_EOL);
            echo $done >= $total * 0.9
                ? "Semantic search is now live."
                : "Still literal-only until 90%.";
            echo PHP_EOL;
          '
