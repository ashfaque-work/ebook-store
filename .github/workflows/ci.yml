name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, pgsql]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ebook_store_test
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ebook_store_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_pgsql, pdo_sqlite, bcmath, intl, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The suite runs on SQLite, so nothing here catches a MySQL-specific
      # problem — strict mode, collation, ONLY_FULL_GROUP_BY, or a migration
      # whose down() only works on one engine. Hence the matrix.
      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db == 'pgsql' && '5432' || '3306' }}
          DB_DATABASE: ${{ matrix.db == 'sqlite' && ':memory:' || 'ebook_store_test' }}
          DB_USERNAME: ${{ matrix.db == 'pgsql' && 'postgres' || 'root' }}
          DB_PASSWORD: password

      # Asserting the outcome, not just the exit code. MySQL refuses to drop an
      # index InnoDB is using to satisfy a foreign key, and a down() that hits
      # that can leave most of the schema standing while still looking like it
      # worked. SQLite enforces none of it, so this job is the only thing that
      # catches it.
      - name: Check migrations roll back cleanly
        if: matrix.db != 'sqlite'
        run: |
          php artisan migrate:fresh --seed
          php artisan migrate:reset
          LEFT=$(php artisan tinker --execute="echo count(Schema::getTables());")
          echo "tables remaining after reset: $LEFT"
          # Only the migrations table itself should survive a reset.
          test "$LEFT" -le 1
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db == 'pgsql' && '5432' || '3306' }}
          DB_DATABASE: ebook_store_test
          DB_USERNAME: ${{ matrix.db == 'pgsql' && 'postgres' || 'root' }}
          DB_PASSWORD: password

  lint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test

  assets:
    name: Build assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # app.js imports Ziggy from vendor/, so the asset build needs Composer's
      # packages as much as npm's. No PHP runs here; only the files matter.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      # `npm ci` is the point of this job as much as the build is: a peer
      # dependency conflict fails here and nowhere else until a deploy.
      - run: npm ci
      - run: npm run format:check
      # A Vue template error is invisible until build time, and on Render a
      # failed build is a failed deploy.
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Informational: a new advisory should be visible the day it lands, but it
    # should not block a deploy that fixes something else.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer audit

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The two known findings both trace to epubjs and need a major bump of
      # the renderer; see docs/SECURITY-NOTES.md.
      - run: npm audit --audit-level=critical

  image:
    name: Build production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # The Dockerfile is what Render actually runs, and it fails in ways the
      # rest of CI cannot see — a missing PHP extension, or an asset build that
      # needs vendor/ present because app.js imports Ziggy from it. Left
      # unbuilt, the first sign of trouble is a failed deploy.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ebook-store:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image has the extensions the app needs
        run: |
          docker run --rm --entrypoint php ebook-store:ci -m > modules.txt
          for ext in pdo_pgsql pdo_mysql bcmath intl zip; do
            grep -qx "$ext" modules.txt || { echo "missing PHP extension: $ext"; exit 1; }
          done
          # OPcache is a Zend extension, so it is listed under its display name
          # rather than alongside the rest — and it stays off in the CLI, which
          # is why this checks the listing and not opcache_get_status().
          grep -qx "Zend OPcache" modules.txt || { echo "missing PHP extension: opcache"; exit 1; }
          echo "all required extensions present"

      - name: The built assets made it into the image
        run: docker run --rm --entrypoint sh ebook-store:ci -c 'test -f public/build/manifest.json'

      # The entrypoint builds the config, route and view caches at boot. It
      # runs before anything the rest of this job can see, and it is where a
      # missing writable directory surfaces — as a container that exits on
      # start, which on Render reads as a deploy that simply never comes up.
      - name: The container boots
        run: |
          docker run --rm \
            -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            ebook-store:ci php artisan about --only=environment

      # The suite renders this under the developer's php.ini. The image has its
      # own, and the sitemap opens with an XML declaration that short_open_tag
      # turns into a PHP open tag — a 500 that only ever appears in the image.
      - name: The sitemap compiles under the image's php.ini
        run: |
          docker run --rm \
            -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            --entrypoint php ebook-store:ci artisan tinker \
            --execute="echo view('sitemap', ['urls' => []])->render();" | grep -q '<?xml'
