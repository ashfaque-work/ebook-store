name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql]

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ebook_store_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_sqlite, bcmath, intl, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The suite runs on SQLite, so nothing here catches a MySQL-specific
      # problem — strict mode, collation, ONLY_FULL_GROUP_BY, or a migration
      # whose down() only works on one engine. Hence the matrix.
      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ${{ matrix.db == 'mysql' && 'ebook_store_test' || ':memory:' }}
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Check migrations roll back cleanly
        if: matrix.db == 'mysql'
        run: php artisan migrate:fresh --seed && php artisan migrate:reset
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ebook_store_test
          DB_USERNAME: root
          DB_PASSWORD: password

  lint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test

  assets:
    name: Build assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` is the point of this job as much as the build is: a peer
      # dependency conflict fails here and nowhere else until a deploy.
      - run: npm ci
      - run: npm run format:check
      # A Vue template error is invisible until build time, and on Render a
      # failed build is a failed deploy.
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Informational: a new advisory should be visible the day it lands, but it
    # should not block a deploy that fixes something else.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer audit

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The two known findings both trace to epubjs and need a major bump of
      # the renderer; see docs/SECURITY-NOTES.md.
      - run: npm audit --audit-level=critical
