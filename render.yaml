# Render blueprint. See docs/08-DEPLOYMENT.md for what has to exist first.
#
# The free plan sleeps after 15 minutes idle, so the first visitor after a
# quiet spell waits roughly 50 seconds. Point an uptime monitor at /up every
# 10 minutes to keep it warm — that is a workaround, and the main reason to
# move to the paid tier once anything sells.
services:
  - type: web
    name: ebook-store
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      # Migrations run from the entrypoint rather than a preDeployCommand,
      # which Render offers only on paid instance types — set there, it is
      # silently ignored on this plan and the schema is never created.
      # On moving to a paid plan, set this to false and use preDeployCommand.
      - key: RUN_MIGRATIONS
        value: true

      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Neon requires TLS.
      - key: DB_SSLMODE
        value: require

      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      # No second process on the free plan, so a queued job would sit
      # unprocessed forever. Switch to `database` when a worker exists.
      - key: QUEUE_CONNECTION
        value: sync

      - key: FILESYSTEM_DISK
        value: r2
      - key: PRIVATE_DISK
        value: r2
      - key: PUBLIC_DISK
        value: r2-public
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Covers are served straight to browsers, books never are. Leave this
      # unset and both share one bucket — which means either the books are
      # public or the covers 404.
      - key: R2_PUBLIC_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false

      - key: RAZORPAY_KEY
        sync: false
      - key: RAZORPAY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # Must match the Razorpay application, and the legal pages read them.
      - key: STORE_LEGAL_NAME
        sync: false
      - key: STORE_TRADING_NAME
        sync: false
      - key: STORE_SUPPORT_EMAIL
        sync: false
      - key: STORE_JURISDICTION
        sync: false

      # Leave GST off until a GSTIN actually exists.
      - key: STORE_GST_ENABLED
        value: false

      # Razorpay wants to read the legal pages on a live URL before it approves
      # the account, so the store goes up first and the till opens after. Paid
      # titles say purchasing opens shortly; free books and the reader work.
      # Set this to true the day the live keys go in.
      - key: STORE_PAYMENTS_ENABLED
        value: false
